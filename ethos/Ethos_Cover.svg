<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="55%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1a2b3a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0f1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softlight">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="2560" fill="url(#bg)"/>
  <rect width="1600" height="2560" fill="url(#glow)"/>

  <!-- Subtle skyline silhouette at bottom (suggests city/boardroom from height) -->
  <g opacity="0.18">
    <rect x="60" y="2360" width="40" height="200" fill="#1a2b3a"/>
    <rect x="115" y="2280" width="55" height="280" fill="#1a2b3a"/>
    <rect x="190" y="2220" width="35" height="340" fill="#1a2b3a"/>
    <rect x="240" y="2300" width="45" height="260" fill="#1a2b3a"/>
    <rect x="305" y="2180" width="60" height="380" fill="#1a2b3a"/>
    <rect x="385" y="2240" width="40" height="320" fill="#1a2b3a"/>
    <rect x="445" y="2150" width="50" height="410" fill="#1a2b3a"/>
    <rect x="515" y="2260" width="35" height="300" fill="#1a2b3a"/>
    <rect x="570" y="2200" width="55" height="360" fill="#1a2b3a"/>
    <rect x="645" y="2120" width="65" height="440" fill="#1a2b3a"/>
    <rect x="730" y="2200" width="40" height="360" fill="#1a2b3a"/>
    <rect x="790" y="2260" width="50" height="300" fill="#1a2b3a"/>
    <rect x="860" y="2180" width="45" height="380" fill="#1a2b3a"/>
    <rect x="925" y="2240" width="55" height="320" fill="#1a2b3a"/>
    <rect x="1000" y="2160" width="40" height="400" fill="#1a2b3a"/>
    <rect x="1060" y="2280" width="35" height="280" fill="#1a2b3a"/>
    <rect x="1115" y="2200" width="60" height="360" fill="#1a2b3a"/>
    <rect x="1195" y="2260" width="45" height="300" fill="#1a2b3a"/>
    <rect x="1260" y="2180" width="50" height="380" fill="#1a2b3a"/>
    <rect x="1330" y="2240" width="40" height="320" fill="#1a2b3a"/>
    <rect x="1390" y="2200" width="55" height="360" fill="#1a2b3a"/>
    <rect x="1465" y="2280" width="35" height="280" fill="#1a2b3a"/>
    <rect x="1520" y="2220" width="45" height="340" fill="#1a2b3a"/>
  </g>

  <!-- A few small lit windows scattered -->
  <g fill="#d4a574" opacity="0.7">
    <rect x="335" y="2230" width="4" height="6"/>
    <rect x="475" y="2200" width="4" height="6"/>
    <rect x="665" y="2180" width="4" height="6"/>
    <rect x="810" y="2310" width="4" height="6"/>
    <rect x="1020" y="2210" width="4" height="6"/>
    <rect x="1280" y="2240" width="4" height="6"/>
  </g>

  <!-- Single warm dot (the lone signal, the unwavering point) -->
  <circle cx="800" cy="600" r="14" fill="#e8b87a" filter="url(#softlight)"/>
  <circle cx="800" cy="600" r="6" fill="#f4d4a8"/>

  <!-- Main title: ETHOS -->
  <text x="800" y="1000"
        font-family="Inter, sans-serif"
        font-size="320"
        font-weight="800"
        letter-spacing="32"
        text-anchor="middle"
        fill="#f5f1e8">ETHOS</text>

  <!-- Thin horizontal divider -->
  <line x1="600" y1="1140" x2="1000" y2="1140" stroke="#e8b87a" stroke-width="1.5" opacity="0.7"/>

  <!-- Subtitle: The Promise -->
  <text x="800" y="1280"
        font-family="Inter, serif"
        font-size="90"
        font-weight="300"
        font-style="italic"
        letter-spacing="6"
        text-anchor="middle"
        fill="#cdb89a">The Promise</text>

  <!-- A novel -->
  <text x="800" y="1400"
        font-family="Inter, sans-serif"
        font-size="38"
        font-weight="400"
        letter-spacing="14"
        text-anchor="middle"
        fill="#8a8174">A   N O V E L</text>

  <!-- Author name at bottom -->
  <text x="800" y="2080"
        font-family="Inter, sans-serif"
        font-size="62"
        font-weight="500"
        letter-spacing="8"
        text-anchor="middle"
        fill="#f5f1e8">ASHISH TYAGI</text>

</svg>
